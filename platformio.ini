[platformio]
default_envs = esp32-s3-devkitc-1

; ============================================================================
; 1. Primary Rover Controller: SANXIXING ESP32-S3 DevKit (N16R8)
;    Flash command: pio run -e esp32-s3-devkitc-1 --target upload
; ============================================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<cam_main.cpp>

; SANXIXING ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM) configuration
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0

; ============================================================================
; 2. Companion FPV Camera: Aideepen ESP32-CAM-MB (AI-Thinker OV2640)
;    Joins "RC-Rover" SoftAP at 192.168.4.2 and streams at :81/stream
;    Flash command: pio run -e esp32cam --target upload
; ============================================================================
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
build_src_filter = -<*> +<cam_main.cpp>
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio

monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
